name: Build Sky Task APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p www && cp index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Create notification tones
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave, struct, math
          tones = {
            'bell': [(880,.25),(660,.6)],
            'chime': [(523,.2),(659,.2),(784,.45)],
            'beep': [(1000,.15),(0,.1),(1000,.15),(0,.1),(1000,.15)],
            'melody': [(392,.2),(494,.2),(587,.2),(784,.55)],
            'silent': [(0,.3)],
          }
          rate = 22050
          for name, notes in tones.items():
              frames = []
              for f, d in notes:
                  n = int(rate * d)
                  for i in range(n):
                      env = math.exp(-4.0 * i / n)
                      v = 0.0 if f == 0 else math.sin(2 * math.pi * f * i / rate) * env * 0.6
                      frames.append(struct.pack('<h', int(v * 32767)))
              w = wave.open('android/app/src/main/res/raw/tone_%s.wav' % name, 'wb')
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)
              w.writeframes(b''.join(frames))
              w.close()
          PY
      - run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.USE_BIOMETRIC"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Use fixed signing key (so updates install over the old app)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "Using fixed key"; else echo "No key secret found - using a random key"; fi
      - run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SkyTask-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
